# Merum for iPhone. Generated into Merum.xcodeproj by `make` (XcodeGen); the project file is not kept in git.
# The heart is ../shared (Library, Note, History, Store, Sync, Paste), as on the Mac.
name: Merum
options:
  bundleIdPrefix: com.geragaraza
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 4PWXU4KC48
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only; the iPhone Duo is an iPhone
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "5"   # 0.1 shipped as build 2 (live 2026-11-25); build numbers keep rising across versions
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  Merum:
    type: application
    platform: iOS
    sources:
      - app
      - path: ../shared
      - gen/AppIcon.icon
    info:
      path: gen/Info.plist
      properties:
        CFBundleDisplayName: Merum
        CFBundleName: Merum
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en]
        CFBundleDevelopmentRegion: en
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [remote-notification]   # the zone's silent push wakes the app to fetch
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    dependencies:
      - sdk: libicucore.tbd     # u_charDirection, each paragraph's direction (shared/direction.swift), as the Mac's -licucore
    # iCloud as the Mac's (AGENTS.md, «iCloud: signing and set-up»): the one container, CloudKit, its Production
    # environment (where the schema is deployed), the key-value store, push (aps-environment from the configuration:
    # development in Debug, production in Release, the App Store build).
    entitlements:
      path: gen/Merum.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.geragaraza.merum]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.geragaraza.merum
        aps-environment: $(MERUM_APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geragaraza.merum
        PRODUCT_NAME: Merum
        # MERUM_ICLOUD starts CloudKit sync and the key-value store; it goes with the entitlements above (without them
        # CKContainer stops the process). Set on the target so it adds to Debug's DEBUG instead of being replaced.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MERUM_ICLOUD
        TARGETED_DEVICE_FAMILY: "1"   # again per target: XcodeGen's iOS app preset sets "1,2" here over the project's
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Push: development for a device build from Xcode, production for the App Store.
      configs:
        Debug:
          MERUM_APS_ENVIRONMENT: development
        Release:
          MERUM_APS_ENVIRONMENT: production
  MerumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - tests
      # The speed corpus, for PhoneTests (kept outside the repo, in the project's bench folder).
      - path: ../../bench/war-and-peace.txt
        buildPhase: resources
        optional: true
      - path: ../../bench/ten-million.txt
        buildPhase: resources
        optional: true
    dependencies:
      - target: Merum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geragaraza.merum.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Merum.app/Merum
        BUNDLE_LOADER: $(TEST_HOST)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Merum:
    build:
      targets:
        Merum: all
        MerumTests: [test]
    test:
      targets: [MerumTests]
